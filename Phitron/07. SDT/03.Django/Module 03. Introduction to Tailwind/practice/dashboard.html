<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-6 bg-gray-100">
    <!-- Header Section Starts Here  -->
    <div class="max-w-[1400px] mx-auto mb-5">
        <header class="">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-semibold">Dashboard</h2>
                <div class="flex justify-center align-middle gap-4">
                    <button class="text-2xl rounded-full p-2 hover:bg-gray-200 w-10 h-10 cursor-pointer relative">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                        </svg>
                    </button>
                    <button class="text-2xl font-semibold w-10 h-10 text-white rounded-full bg-blue-500 cursor-pointer">
                        B
                    </button>
                </div>
            </div>
        </header>
    </div>
    <!-- Header Section Ends Here  -->

    <main>
        <!-- Grids Section Starts Here  -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <!-- Total Task Starts here  -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div>
                    <h2 class="text-2xl font-semibold text-gray-500">TOTAL TASK</h2>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-2xl font-semibold ">3</p>
                        <p class="font-semibold text-gray-500">111 last month</p>
                    </div>
                    <div class="w-10 h-10 bg-blue-100 p-2 rounded-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-6 h-6 rounded-full text-blue-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                        </svg>

                    </div>
                </div>
            </div>
            <!-- Total Task Ends here  -->
            <!-- Completed Task Starts here  -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div>
                    <h2 class="text-2xl font-semibold text-gray-500">COMPLETED TASK</h2>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-2xl font-semibold ">1</p>
                        <p class="font-semibold text-gray-500">111 last month</p>
                    </div>
                    <div class="w-10 h-10 bg-green-100 p-2 rounded-full">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-6 h-6 rounded-full text-green-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>
                    </div>
                </div>
            </div>
            <!-- Completed Task Ends here  -->
            <!-- Task in progress starts here  -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div>
                    <h2 class="text-2xl font-semibold text-gray-500">TASK IN PROGRESS</h2>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-2xl font-semibold ">1</p>
                        <p class="font-semibold text-gray-500">111 last month</p>
                    </div>
                    <div class="w-10 h-10 bg-orange-100 p-2 rounded-full">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-6 h-6 rounded-full text-orange-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>

                    </div>
                </div>
            </div>
            <!-- Task in progress ends here  -->
            <!-- Todo starts Here -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div>
                    <h2 class="text-2xl font-semibold text-gray-500">TODOS</h2>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-2xl font-semibold ">1</p>
                        <p class="font-semibold text-gray-500">111 last month</p>
                    </div>
                    <div class="w-10 h-10 bg-purple-100 p-2 rounded-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 rounded-full text-purple-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                        </svg>

                    </div>
                </div>
            </div>
            <!-- Todo Ends Here -->
        </div>
        <!-- Grids Section Ends Here  -->

        <!-- Task Table Contents Starts here  -->

        <!-- Task Table Header Starts Here  -->
        <div class="bg-white rounded-xl shadow-sm">
            <div class="grid grid-cols-4 p-4 gap-4 item-center p-4 border-b border-gray-100 text-sm text-gray-500">
                <div>TASK TITLE</div>
                <div>PRIORITY</div>
                <div>TEAM</div>
                <div>CREATED AT</div>
            </div>

            <!-- Tasks ITEMs Section Starts Here  -->
            <div class="divide-y divide-red-500">
                <div class="grid grid-cols-4 p-4 gap-4 item-center">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <div>
                            <span>Test Low Tasks</span>
                        </div>
                    </div>

                    <div>
                        <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-600 text-sm">Low</span>
                    </div>

                    <div>
                        <div class="flex -space-x-2">
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                CA</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                JS</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                B</div>
                        </div>
                    </div>
                    <div>
                        <span class="text-gray-500">9 months ago</span>
                    </div>
                </div>
            </div>

            <div class="divide-y divide-red-500">
                <div class="grid grid-cols-4 p-4 gap-4 item-center">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
                        <div>
                            <span>Test Tasks</span>
                        </div>
                    </div>

                    <div>
                        <span class="px-3 py-1 rounded-full bg-green-100 text-green-600 text-sm">Normal</span>
                    </div>

                    <div>
                        <div class="flex -space-x-2">
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                AJ</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                EV</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                B</div>
                        </div>
                    </div>
                    <div>
                        <span class="text-gray-500">9 months ago</span>
                    </div>
                </div>
            </div>
            <div class="divide-y divide-red-500">
                <div class="grid grid-cols-4 p-4 gap-4 item-center">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-red-500 rounded-full"></div>
                        <div>
                            <span>Test Tasks</span>
                        </div>
                    </div>

                    <div>
                        <span class="px-3 py-1 rounded-full bg-red-100 text-red-600 text-sm">High</span>
                    </div>

                    <div>
                        <div class="flex -space-x-2">
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                CA</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                JS</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                AJ</div>
                            <div
                                class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white border-2 border-white">
                                B</div>
                        </div>
                    </div>
                    <div>
                        <span class="text-gray-500">9 months ago</span>
                    </div>
                </div>
            </div>
            <!-- Tasks ITEMs Section Ends Here  -->

        </div>
        <!-- Task Table Header Ends Here  -->



        <!-- Task Table Contents Ends here  -->


    </main>
</body>

</html>
